# ============================================================================
# Meowvivors — Codemagic CI/CD (Unity 6000.3.15f1 -> iOS)
# DÜZELTME: unity-hub ile Unity kurma + executable tam yolu
# ============================================================================

definitions:
  unity_setup: &unity_setup
    name: Install Unity via unity-hub
    script: |
      # unity-hub kur + Unity 6000.3.15f1 indir
      # --architecture arm64: M2 Apple Silicon; olmazsa headless'ta mimari sorusu takilir
      # --module ios --childModules: iOS Build Support + alt modulleri (yoksa -buildTarget iOS patlar)
      brew install --cask unity-hub
      /Applications/Unity\ Hub.app/Contents/MacOS/Unity\ Hub -- --headless install \
        --version 6000.3.15f1 --changeset 7aa55fbf98c2 \
        --architecture arm64 --module ios --childModules
  unity_activate: &unity_activate
    name: Activate Unity (manual .ulf license)
    script: |
      # Secure var UNITY_LICENSE_ULF_B64 -> decode -> .ulf dosyasi
      echo "$UNITY_LICENSE_ULF_B64" | base64 --decode > /tmp/unity_lic.ulf
      # -manualLicenseFile basariyla import etse bile exit 1 donebilir (Unity ozelligi) -> || true
      /Applications/Unity/Hub/Editor/6000.3.15f1/Unity.app/Contents/MacOS/Unity \
        -batchmode -nographics -quit -logFile - \
        -manualLicenseFile /tmp/unity_lic.ulf || true
  unity_return: &unity_return
    name: Return Unity license (manual license - no-op)
    script: |
      # Manual .ulf lisansta floating seat tuketilmez; iade adimina gerek yok.
      echo "Manual .ulf license — iade gerekmiyor."
      rm -f /tmp/unity_lic.ulf || true

workflows:

  # --------------------------------------------------------------------------
  # 1) SADECE Unity -> Xcode projesi uret. Apple hesabi GEREKMEZ.
  # --------------------------------------------------------------------------
  ios-xcode-build:
    name: Meowvivors iOS (Xcode project only)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - unity
    scripts:
      - *unity_setup
      - *unity_activate
      - name: Build iOS Xcode project (Unity)
        script: |
          /Applications/Unity/Hub/Editor/6000.3.15f1/Unity.app/Contents/MacOS/Unity \
            -batchmode -nographics -quit -logFile - \
            -projectPath . -executeMethod BuildScript.BuildIos -buildTarget iOS
      - *unity_return
    artifacts:
      - ios/**
      - /tmp/unity_*.log

  # --------------------------------------------------------------------------
  # 2) TAM YAYIN: Unity -> Xcode -> imzala -> .ipa -> TestFlight/App Store.
  # --------------------------------------------------------------------------
  ios-appstore:
    name: Meowvivors iOS (App Store)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - unity
      vars:
        BUNDLE_ID: "com.yamineko.meowvivors"
        XCODE_PROJECT: "ios/Unity-iPhone.xcodeproj"
        XCODE_SCHEME: "Unity-iPhone"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yamineko.meowvivors
      xcode: latest
      cocoapods: default
    scripts:
      - *unity_setup
      - *unity_activate
      - name: Build iOS Xcode project (Unity)
        script: |
          /Applications/Unity/Hub/Editor/6000.3.15f1/Unity.app/Contents/MacOS/Unity \
            -batchmode -nographics -quit -logFile - \
            -projectPath . -executeMethod BuildScript.BuildIos -buildTarget iOS
      - *unity_return
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \; || true
      - name: Build signed .ipa
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
