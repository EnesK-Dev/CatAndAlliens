# ============================================================================
# Meowvivors — Codemagic CI/CD (Unity 6000.3.15f1 -> iOS)   [Unity PERSONAL lisans]
# DUZELTI: UNITY_HOME yerine `unity` komutunu kullan (Codemagic PATH'te var)
# ============================================================================

definitions:
  unity_activate: &unity_activate
    name: Activate Unity (Personal - online login)
    script: |
      # Personal: Unity hesabi kullanici adi + sifre ile online aktive olur.
      # ONEMLI: Unity hesabinda 2FA (iki adimli dogrulama) KAPALI olmali.
      unity -batchmode -nographics -quit -logFile /dev/stdout \
        -username "$UNITY_USERNAME" -password "$UNITY_PASSWORD"
  unity_return: &unity_return
    name: Return Unity license (Personal seat'i serbest birak)
    script: |
      unity -batchmode -nographics -quit -returnlicense -logFile /dev/stdout \
        -username "$UNITY_USERNAME" -password "$UNITY_PASSWORD" || true

workflows:

  # --------------------------------------------------------------------------
  # 1) SADECE Unity -> Xcode projesi uret. Apple hesabi GEREKMEZ.
  # --------------------------------------------------------------------------
  ios-xcode-build:
    name: Meowvivors iOS (Xcode project only)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - unity
      vars:
        XCODE_PROJECT: "ios/Unity-iPhone.xcodeproj"
    scripts:
      - *unity_activate
      - name: Build iOS Xcode project (Unity)
        script: |
          unity -batchmode -nographics -quit -logFile /dev/stdout \
            -projectPath . -executeMethod BuildScript.BuildIos -buildTarget iOS
      - *unity_return
    artifacts:
      - ios/**          # uretilen Xcode projesi
      - /tmp/unity_*.log

  # --------------------------------------------------------------------------
  # 2) TAM YAYIN: Unity -> Xcode -> imzala -> .ipa -> TestFlight/App Store.
  # --------------------------------------------------------------------------
  ios-appstore:
    name: Meowvivors iOS (App Store)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - unity
      vars:
        BUNDLE_ID: "com.yamineko.meowvivors"
        XCODE_PROJECT: "ios/Unity-iPhone.xcodeproj"
        XCODE_SCHEME: "Unity-iPhone"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yamineko.meowvivors
      xcode: latest
      cocoapods: default
    scripts:
      - *unity_activate
      - name: Build iOS Xcode project (Unity)
        script: |
          unity -batchmode -nographis -quit -logFile /dev/stdout \
            -projectPath . -executeMethod BuildScript.BuildIos -buildTarget iOS
      - *unity_return
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \; || true
      - name: Build signed .ipa
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
