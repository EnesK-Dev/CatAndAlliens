name: Upload to TestFlight

on:
  workflow_dispatch:
    inputs:
      tag:
        description: ".ipa'nin ekli oldugu Release tag'i (or: ios-build-3)"
        required: true

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Download .ipa from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.event.inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.ipa" --dir "$RUNNER_TEMP"
          ls -la "$RUNNER_TEMP"/*.ipa

      - name: Prepare App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Upload to TestFlight (altool)
        run: |
          IPA=$(ls "$RUNNER_TEMP"/*.ipa | head -1)
          echo "Uploading: $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}"
